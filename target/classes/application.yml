spring:
  application:
    name: account-service
  mongodb:
    uri: ${MONGODB_URI:mongodb://localhost:27018/account-service-db}
  cloud:
    function:
      definition: accountEventProducer;customerEventConsumer
    stream:
      kafka:
        binder:
          brokers: ${KAFKA_BROKERS:localhost:9092}
      bindings:
        accountEventProducer-out-0:
          destination: account-events
          content-type: application/json
        customerEventConsumer-in-0:
          destination: customer-events
          group: account-customer-replica-group
          content-type: application/json

resilience4j:
  circuitbreaker:
    configs:
      default:
        registerHealthIndicator: true
        slidingWindowType: COUNT_BASED
        slidingWindowSize: 10
        minimumNumberOfCalls: 5
        permittedNumberOfCallsInHalfOpenState: 3
        automaticTransitionFromOpenToHalfOpenEnabled: true
        waitDurationInOpenState: 10s
        failureRateThreshold: 50
    instances:
      bankServiceCB:
        baseConfig: default

  timelimiter:
    configs:
      default:
        timeoutDuration: 2s
        cancelRunningFuture: true
    instances:
      bankServiceCB:
        baseConfig: default

springdoc:
  api-docs:
    enabled: true
  swagger-ui:
    url: /account-openapi.yml
    path: /swagger-ui.html

eureka:
  client:
    service-url:
      defaultZone: ${EUREKA_SERVER_URL:http://localhost:8761/eureka/}
  instance:
    prefer-ip-address: true

server:
  port: ${PORT:8082}