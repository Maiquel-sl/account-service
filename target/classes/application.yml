spring:
  application:
    name: account-service
  mongodb:
    uri: ${MONGODB_URI:mongodb://localhost:27017/account-service-db}
  cloud:
    function:
      definition: accountEventProducer
    stream:
      kafka:
        binder:
          brokers: ${KAFKA_BROKERS:localhost:9092}
      bindings:
        accountEventProducer-out-0:
          destination: bank-account-events
          content-type: application/json

springdoc:
  api-docs:
    enabled: true
  swagger-ui:
    url: /account-openapi.yml
    path: /swagger-ui.html

eureka:
  client:
    service-url:
      defaultZone: ${EUREKA_SERVER_URL:http://localhost:8761/eureka/}
  instance:
    prefer-ip-address: true

server:
  port: ${PORT:8082}